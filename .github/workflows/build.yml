name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: 编译与单测
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 镜像自带 Android SDK（ANDROID_HOME 已预置、许可证已接受）。
      # 不再用 android-actions/setup-android：它要现下 cmdline-tools，
      # 在近期 runner 上经常在这一步直接失败（实测 12 秒挂掉，后面的步骤全跳过）。
      # 缺的 platform / build-tools 由 Gradle 的 sdkDownload 自动补齐。
      - name: 确认 Android SDK 可用
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-未设置}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-未设置}"
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms" 2>/dev/null || echo "（platforms 目录为空，Gradle 会自动下载）"

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      # 只编译 Kotlin，不触发 NDK/CMake。
      # native 构建（QuickJS / FFmpeg）在 CI 上要下载 2GB 的 NDK，
      # 对「防止推上来编译不过」这个目的来说不值得。
      - name: 编译 Debug Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace

      - name: 单元测试
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7
